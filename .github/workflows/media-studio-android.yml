name: Build Viyzo Media Hub APK

concurrency:
  group: media-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [media-studio-isolated]
    paths:
      - "media-studio/**"
      - ".github/workflows/media-studio-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package Media Hub dashboard as Android app
        run: |
          mkdir -p media-studio/android/app/src/main/assets
          cp media-studio/index.html media-studio/android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: media-studio/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Viyzo-Media-Hub-Demo-APK
          path: media-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
