name: Build Viyzo Go FULL FUTURE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/viyzo/app
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/com/viyzo/app/MainActivity.java

          if [ -f "google-services.json" ]; then
            cp "google-services.json" app/google-services.json
          elif [ -f "google-services .json" ]; then
            cp "google-services .json" app/google-services.json
          else
            echo "ERROR: google-services file not found"
            exit 1
          fi

          cat > gradle.properties <<'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          PROPS

          cat > settings.gradle <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Viyzo-Go"
          include(":app")
          SETTINGS

          cat > build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          ROOT

          cat > app/build.gradle <<'APP'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.viyzo.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.viyzo.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '1.2'
              }
          }

          dependencies {
              // Firebase libraries are version-managed by the Firebase BoM.
              implementation platform('com.google.firebase:firebase-bom:34.19.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              implementation 'com.google.firebase:firebase-storage'

              // Google Mobile Ads SDK for the new AdMob code.
              implementation 'com.google.android.gms:play-services-ads:25.4.0'
          }
          APP

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Viyzo Go"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <!-- Google test AdMob App ID for development. Replace before release. -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713" />

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/res/values/styles.xml <<'STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          STYLES

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viyzo-Go-APK
          path: app/build/outputs/apk/debug/app-debug.apk
